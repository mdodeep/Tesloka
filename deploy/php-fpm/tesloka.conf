; ==============================================================================
; TESLOKA CBT — PHP 8.5-FPM Pool Configuration (16 GB RAM VPS Optimization)
; Path on aaPanel: /www/server/php/85/etc/php-fpm.d/tesloka.conf
; ==============================================================================

[tesloka]
user = www
group = www
listen = /tmp/php-cgi-85.sock
listen.owner = www
listen.group = www
listen.mode = 0666

; Dynamic Process Manager Tuning untuk 16 GB RAM & 4 vCPU
; Perhitungan alokasi: 64 worker x ~60MB rata-rata PHP process = ~3.84 GB RAM dialokasikan untuk PHP-FPM
; Sisa RAM dialokasikan untuk PostgreSQL (6 GB shared buffers/work_mem), Redis (2 GB), OS & buffer (4 GB)
pm = dynamic
pm.max_children = 64
pm.start_servers = 16
pm.min_spare_servers = 8
pm.max_spare_servers = 32
pm.max_requests = 1000

; Timeout & Limits
request_terminate_timeout = 120s
request_slowlog_timeout = 5s
slowlog = /www/wwwlogs/php-fpm-tesloka-slow.log

; PHP INI Overrides untuk CBT Production
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 120
php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[max_input_vars] = 5000
php_admin_flag[log_errors] = on
php_admin_value[error_log] = /www/wwwlogs/php-fpm-tesloka-error.log

; OPcache High-Performance Tuning
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.enable_cli] = 1
php_admin_value[opcache.memory_consumption] = 256
php_admin_value[opcache.interned_strings_buffer] = 32
php_admin_value[opcache.max_accelerated_files] = 20000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.revalidate_freq] = 0
php_admin_value[opcache.save_comments] = 1

