; ==============================================================================
; TESLOKA CBT — Supervisor Queue Worker Daemon Configuration
; Path: /etc/supervisor/conf.d/tesloka-worker.conf (atau aaPanel Supervisor Manager)
; ==============================================================================

[program:tesloka-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /www/wwwroot/cbt.institusi.ac.id/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www
numprocs=4
redirect_stderr=true
stdout_logfile=/www/wwwlogs/tesloka-worker.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=5
stopwaitsecs=120

