; ==============================================================================
; TESLOKA CBT — Supervisor Scheduler Daemon Configuration
; Path: /etc/supervisor/conf.d/tesloka-scheduler.conf
; ==============================================================================

[program:tesloka-scheduler]
process_name=%(program_name)s
command=/bin/sh -c "while [ true ]; do php /www/wwwroot/cbt.institusi.ac.id/artisan schedule:run --verbose --no-interaction & sleep 60; done"
autostart=true
autorestart=true
user=www
redirect_stderr=true
stdout_logfile=/www/wwwlogs/tesloka-scheduler.log
stdout_logfile_maxbytes=20MB
stdout_logfile_backups=3

