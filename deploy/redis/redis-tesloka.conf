# ==============================================================================
# TESLOKA CBT — Redis Production Configuration (Cache & Telemetri Real-Time)
# Target: Redis 8.x pada VPS 16 GB RAM
# ==============================================================================

# Memory Allocation (2 GB Alokasi untuk CBT Session, Cache, & Heartbeat)
maxmemory 2147483648
maxmemory-policy noeviction

# Persistensi AOF & RDB untuk Ketahanan Telemetri
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Networking & Security
bind 127.0.0.1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Client Limits
maxclients 10000

