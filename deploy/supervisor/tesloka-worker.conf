; ==============================================================================
; TESLOKA CBT — Supervisor Queue Worker Daemon Configuration
; ==============================================================================
; PANDUAN PENGGUNAAN:
;
; OPSI A: Jika Menggunakan Plugin 'Supervisor Manager' di aaPanel
;   1. Buka aaPanel > App Store > Supervisor Manager > Add Daemon:
;      - Name:         tesloka-worker
;      - Run User:     www
;      - Run Dir:      /www/wwwroot/nama-folder-cbt-anda
;      - Command:      php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120
;      - Processes:    2 s.d. 4 (sesuai kapasitas RAM server)
;   2. Klik 'Confirm' dan pastikan status daemon menjadi 'Running'.
;
; OPSI B: Jika Menggunakan Supervisor Standar Linux (/etc/supervisor/conf.d/)
;   1. Salin file ini ke: /etc/supervisor/conf.d/tesloka-worker.conf
;   2. Sesuaikan parameter direktori, user, dan path php di bawah.
;   3. Muat ulang supervisor:
;      sudo supervisorctl reread && sudo supervisorctl update && sudo supervisorctl start tesloka-worker:*
; ==============================================================================

[program:tesloka-worker]
process_name=%(program_name)s_%(process_num)02d

; Perintah eksekusi worker:
; CATATAN: Ganti '/var/www/tesloka' dengan path direktori proyek Anda.
; Jika perintah 'php' tidak ditemukan oleh supervisor, gunakan path absolut (contoh: /usr/bin/php atau /www/server/php/85/bin/php).
directory=/var/www/tesloka
command=php artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --timeout=120

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; User proses:
; - Ubuntu/Debian Standar: user=www-data
; - aaPanel:               user=www
; - CentOS/AlmaLinux:      user=nginx
user=www-data

; Jumlah worker konkuren (rekomendasi: 2 untuk VPS 2-4GB RAM, 4 untuk VPS 8-16GB RAM):
numprocs=4

redirect_stderr=true

; Pastikan folder log sudah dibuat dan memiliki izin tulis oleh user terkait:
stdout_logfile=/var/log/tesloka-worker.log
; Alternatif aaPanel: stdout_logfile=/www/wwwlogs/tesloka-worker.log

stdout_logfile_maxbytes=20MB
stdout_logfile_backups=5
stopwaitsecs=120
