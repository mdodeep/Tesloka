# ==============================================================================
# TESLOKA CBT — Redis Production Configuration (Universal & Sizing Guide)
# ==============================================================================
# PANDUAN PENGGUNAAN:
#
# OPSI A: Jika Menggunakan aaPanel
#   Buka aaPanel > App Store > Redis > Settings:
#   1. Di tab 'Performance Tuning':
#      - Sesuaikan Max Memory sesuai RAM server Anda (lihat tabel di bawah).
#   2. Di tab 'Configuration File':
#      - Pastikan 'maxmemory-policy' diatur ke 'allkeys-lru' (JANGAN noeviction agar tidak crash saat RAM penuh).
#      - Jika mengatur password (requirepass), masukkan juga ke .env (REDIS_PASSWORD=...).
#
# OPSI B: Jika Menggunakan Ubuntu Standar (/etc/redis/redis.conf)
#   Sesuaikan baris konfigurasi berikut di file /etc/redis/redis.conf lalu restart Redis:
#   sudo systemctl restart redis-server
# ==============================================================================

# ------------------------------------------------------------------------------
# PANDUAN ALOKASI MEMORI REDIS BERDASARKAN RAM VPS:
# ------------------------------------------------------------------------------
# VPS 2 GB RAM  : maxmemory 256mb
# VPS 4 GB RAM  : maxmemory 512mb
# VPS 8 GB RAM  : maxmemory 1024mb (1 GB)
# VPS 16 GB RAM : maxmemory 2048mb (2 GB — Rekomendasi Resmi)
# VPS 32 GB RAM : maxmemory 4096mb (4 GB)
# ------------------------------------------------------------------------------
maxmemory 2048mb

# Eviction Policy:
# Wajib 'allkeys-lru' atau 'volatile-lru' agar Redis secara otomatis membersihkan
# cache lama saat batas memori tercapai, MENCEGAH error OOM (Out-of-Memory) di Laravel.
maxmemory-policy allkeys-lru

# Persistensi AOF & RDB untuk Ketahanan Data
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfsync everysec
no-appendfsync-on-rewrite yes
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Jaringan & Keamanan
bind 127.0.0.1 ::1
protected-mode yes
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Client Limits
maxclients 10000

# Password (Opsional tapi direkomendasikan jika server terhubung jaringan publik):
# requirepass MasukkanPasswordAmanDisini
