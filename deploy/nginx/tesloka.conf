# ==============================================================================
# TESLOKA CBT — Nginx Production Configuration (Universal & Multi-Environment)
# ==============================================================================
# Panduan Penyesuaian:
# 1. Ganti 'cbt.institusi.ac.id' dengan domain Anda (atau subdomain: staff.*, ujian.*, sertifikat.*).
# 2. Ganti '/www/wwwroot/cbt.institusi.ac.id/public' dengan path folder public/ proyek Anda.
# 3. Sesuaikan 'fastcgi_pass' dengan socket PHP-FPM server Anda:
#    - aaPanel PHP 8.3:  unix:/tmp/php-cgi-83.sock;
#    - aaPanel PHP 8.4:  unix:/tmp/php-cgi-84.sock;
#    - aaPanel PHP 8.5:  unix:/tmp/php-cgi-85.sock;
#    - Ubuntu Standar:   unix:/run/php/php8.3-fpm.sock; (atau php8.4/8.5)
#    - TCP / Docker:     127.0.0.1:9000;
# 4. Sesuaikan direktori log:
#    - aaPanel:         /www/wwwlogs/
#    - Ubuntu Standar:  /var/log/nginx/
# ==============================================================================

# Rate Limiting Zone (Opsional - Perlindungan DDoS & Spam)
limit_req_zone $binary_remote_addr zone=tesloka_api_limit:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=tesloka_autosave_limit:10m rate=20r/s;

# ------------------------------------------------------------------------------
# BLOK 1: HTTP (Port 80) — Untuk Setup Awal Sebelum Pasang SSL / Let's Encrypt
# ------------------------------------------------------------------------------
# CATATAN: Jika sudah memasang SSL, aktifkan baris return 301 untuk redirect ke HTTPS.
server {
    listen 80;
    listen [::]:80;

    # Masukkan domain utama dan/atau subdomain institusi Anda:
    server_name cbt.institusi.ac.id staff.institusi.ac.id ujian.institusi.ac.id sertifikat.institusi.ac.id;

    # Redirect ke HTTPS jika SSL sudah terpasang (Hapus komentar '#' di bawah jika SSL aktif):
    # return 301 https://$host$request_uri;

    # Root direktori wajib mengarah ke folder public/ Laravel:
    root /www/wwwroot/cbt.institusi.ac.id/public;
    index index.php index.html;
    charset utf-8;

    # Ukuran upload berkas (bank soal zip, media audio/video, foto profil)
    client_max_body_size 50M;
    client_body_buffer_size 128k;

    # Keamanan Header HTTP
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Gzip Compression untuk menghemat bandwidth ujian serentak
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    # Fallback Routing Utama Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Penanganan File PHP via PHP-FPM FastCGI
    location ~ \.php$ {
        # SESUAIKAN DENGAN SOCKET PHP-FPM ANDA:
        fastcgi_pass unix:/tmp/php-cgi-85.sock;
        # Alternatif jika aaPanel PHP 8.3:  fastcgi_pass unix:/tmp/php-cgi-83.sock;
        # Alternatif jika Ubuntu standar:   fastcgi_pass unix:/run/php/php8.3-fpm.sock;
        # Alternatif jika TCP/Docker:       fastcgi_pass 127.0.0.1:9000;

        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;

        # Buffer & Timeout agar tidak terjadi 504 Gateway Timeout saat ujian/regrade massal
        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 180s;
        fastcgi_read_timeout 180s;
    }

    # Caching Aset Statis Frontend (Tailwick, JS, CSS, Font, Logo)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Blokir akses langsung ke file sensitif (.env, .git, storage privat)
    location ^~ /storage/app/private/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Logging
    # Jika di aaPanel:
    access_log /www/wwwlogs/tesloka_cbt_access.log combined buffer=64k flush=5m;
    error_log /www/wwwlogs/tesloka_cbt_error.log warn;
    # Jika di Ubuntu standar (tanpa aaPanel):
    # access_log /var/log/nginx/tesloka_access.log;
    # error_log /var/log/nginx/tesloka_error.log warn;
}

