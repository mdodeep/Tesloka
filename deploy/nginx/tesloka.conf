# ==============================================================================
# TESLOKA CBT — Nginx Production Server Configuration (aaPanel / Linux)
# Target Environment: 4 vCPU, 16 GB RAM, 100 GB NVMe SSD (aaPanel, Ubuntu 24.04)
# ==============================================================================

# Rate Limiting Zone untuk Jalur Kritis CBT
limit_req_zone $binary_remote_addr zone=cbt_autosave_limit:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=cbt_api_limit:10m rate=30r/s;

server {
    listen 80;
    listen [::]:80;
    server_name cbt.institusi.ac.id;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name cbt.institusi.ac.id;
    root /www/wwwroot/cbt.institusi.ac.id/public;

    index index.php index.html;
    charset utf-8;

    # SSL TLS Configuration (Modern & Secure)
    ssl_certificate /www/server/panel/vhost/cert/cbt.institusi.ac.id/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/cbt.institusi.ac.id/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:20m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # Security Headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Buffer & Timeout Optimization untuk Skala 1.000 Peserta Konkuren
    client_max_body_size 50M;
    client_body_buffer_size 128k;
    client_header_buffer_size 4k;
    large_client_header_buffers 4 16k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    keepalive_timeout 65s;
    send_timeout 30s;

    # Gzip Compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/atom+xml
        application/javascript
        application/json
        application/rss+xml
        application/vnd.ms-fontobject
        application/x-font-ttf
        application/x-web-app-manifest+json
        application/xhtml+xml
        application/xml
        font/opentype
        image/svg+xml
        image/x-icon
        text/css
        text/plain
        text/x-component;

    # FastCGI PHP-FPM Configuration
    location ~ \.php$ {
        fastcgi_pass unix:/tmp/php-cgi-85.sock;
        fastcgi_index index.php;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include fastcgi_params;

        fastcgi_buffer_size 32k;
        fastcgi_buffers 16 16k;
        fastcgi_busy_buffers_size 64k;
        fastcgi_temp_file_write_size 64k;
        fastcgi_connect_timeout 30s;
        fastcgi_send_timeout 120s;
        fastcgi_read_timeout 120s;
    }

    # Static Assets Caching (Tailwick, Fonts, Icons, Media)
    location ~* \.(jpg|jpeg|png|gif|ico|webp|svg|woff|woff2|ttf|eot|css|js)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform, immutable";
        access_log off;
    }

    # Proteksi Jalur Penyimpanan Privat & Berkas Sensitif
    location ^~ /storage/app/private/ {
        deny all;
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Autosave Rate Limiting Protection (Pencegah DDoS & Request Flooding)
    location ~ ^/ujian/attempts/.+/save-answer {
        limit_req zone=cbt_autosave_limit burst=20 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # REST API v1 Rate Limiting
    location ^~ /api/v1/ {
        limit_req zone=cbt_api_limit burst=40 nodelay;
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Fallback Routing Laravel
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Logging
    access_log /www/wwwlogs/cbt.institusi.ac.id.log combined buffer=64k flush=5m;
    error_log /www/wwwlogs/cbt.institusi.ac.id.error.log warn;
}

