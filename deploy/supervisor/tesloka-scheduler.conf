; ==============================================================================
; TESLOKA CBT — Supervisor Scheduler Daemon Configuration
; ==============================================================================
; PANDUAN PENGGUNAAN:
;
; OPSI 1 (SANGAT DIREKOMENDASIKAN): Menggunakan Linux System Crontab
;   Metode ini adalah standar resmi Laravel yang paling hemat memori dan stabil.
;   Anda TIDAK PERLU menambahkan file supervisor ini jika menggunakan crontab.
;   Cukup jalankan di terminal server:
;     crontab -e
;   Lalu tambahkan 1 baris berikut di baris paling bawah:
;     * * * * * cd /path/to/tesloka && php artisan schedule:run >> /dev/null 2>&1
;   (Di aaPanel: buka menu Cron > Tambah Cron Task > Tipe 'Shell Script' tiap 1 menit).
;
; OPSI 2: Menggunakan Supervisor Daemon (Jika ingin dipantau via Supervisor)
;   Salin konfigurasi ini ke: /etc/supervisor/conf.d/tesloka-scheduler.conf
;   (Atau tambahkan di aaPanel Supervisor Manager: command 'php artisan schedule:work')
; ==============================================================================

[program:tesloka-scheduler]
process_name=%(program_name)s

; Ganti '/var/www/tesloka' dengan path direktori instalasi Anda:
directory=/var/www/tesloka

; Laravel 11/12/13 menyediakan command bawaan 'schedule:work' yang aman dan native:
command=php artisan schedule:work

autostart=true
autorestart=true
stopasgroup=true
killasgroup=true

; User proses:
; - Ubuntu/Debian Standar: user=www-data
; - aaPanel:               user=www
user=www-data

redirect_stderr=true
stdout_logfile=/var/log/tesloka-scheduler.log
; Alternatif aaPanel: stdout_logfile=/www/wwwlogs/tesloka-scheduler.log

stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
