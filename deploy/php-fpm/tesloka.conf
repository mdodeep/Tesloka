; ==============================================================================
; TESLOKA CBT : PHP-FPM Pool Configuration (Universal & Sizing Guide)
; ==============================================================================
; PANDUAN PENGGUNAAN:
;
; OPSI A: Jika Menggunakan aaPanel
;   Anda TIDAK WAJIB membuat file pool baru ini jika tidak ingin socket terpisah.
;   Cukup buka aaPanel > App Store > PHP-8.x > Settings:
;   1. Di tab 'Configuration (php.ini)':
;      - memory_limit = 256M (atau 512M untuk server 16GB+)
;      - upload_max_filesize = 50M
;      - post_max_size = 50M
;      - max_execution_time = 120
;      - max_input_vars = 5000
;   2. Di tab 'Performance Tuning':
;      - Sesuaikan max_children sesuai tabel RAM di bawah.
;
; OPSI B: Jika Menggunakan Dedicated Pool / Server Ubuntu Standar
;   Salin file ini ke:
;   - Ubuntu/Debian: /etc/php/8.3/fpm/pool.d/tesloka.conf (sesuaikan versi 8.3/8.4/8.5)
;   - aaPanel:       /www/server/php/85/etc/php-fpm.d/tesloka.conf
;   PENTING: Pastikan parameter 'listen' tidak bertabrakan dengan pool bawaan!
; ==============================================================================

[tesloka]
; User dan Group:
; - aaPanel:        user = www       | group = www
; - Ubuntu/Debian:  user = www-data  | group = www-data
; - CentOS/Alma:    user = nginx     | group = nginx
user = www
group = www

; Socket Khusus (Dedicated) agar tidak konflik dengan pool bawaan server:
listen = /tmp/php-cgi-tesloka.sock
listen.owner = www
listen.group = www
listen.mode = 0666

; ------------------------------------------------------------------------------
; PANDUAN TUNING PROCESS MANAGER (PM) BERDASARKAN KAPASITAS RAM VPS:
; Rata-rata 1 proses PHP-FPM Laravel CBT mengonsumsi ~40-60 MB RAM.
; ------------------------------------------------------------------------------
; [VPS 2 GB RAM]  (30-50 siswa serentak):
;   pm = dynamic
;   pm.max_children = 12
;   pm.start_servers = 3
;   pm.min_spare_servers = 2
;   pm.max_spare_servers = 6
;
; [VPS 4 GB RAM]  (50-100 siswa serentak):
;   pm = dynamic
;   pm.max_children = 24
;   pm.start_servers = 6
;   pm.min_spare_servers = 3
;   pm.max_spare_servers = 12
;
; [VPS 8 GB RAM]  (100-250 siswa serentak):
;   pm = dynamic
;   pm.max_children = 48
;   pm.start_servers = 12
;   pm.min_spare_servers = 6
;   pm.max_spare_servers = 24
;
; [VPS 16 GB RAM] (500-1.000 siswa serentak: Standar Baseline Produksi Resmi):
;   pm = dynamic
;   pm.max_children = 64
;   pm.start_servers = 16
;   pm.min_spare_servers = 8
;   pm.max_spare_servers = 32
;
; [VPS 32 GB RAM] (500-1000+ siswa serentak):
;   pm = dynamic
;   pm.max_children = 128
;   pm.start_servers = 32
;   pm.min_spare_servers = 16
;   pm.max_spare_servers = 64
; ------------------------------------------------------------------------------

pm = dynamic
pm.max_children = 64
pm.start_servers = 16
pm.min_spare_servers = 8
pm.max_spare_servers = 32
pm.max_requests = 1000

; Batas Waktu & Monitoring Slowlog
request_terminate_timeout = 180s
request_slowlog_timeout = 10s

; Pastikan folder log ada sebelum mengaktifkan (contoh: /var/log/ atau /www/wwwlogs/)
; slowlog = /tmp/php-fpm-tesloka-slow.log

; Nilai Konfigurasi PHP untuk Lingkungan CBT
php_admin_value[memory_limit] = 256M
php_admin_value[max_execution_time] = 180
php_admin_value[post_max_size] = 50M
php_admin_value[upload_max_filesize] = 50M
php_admin_value[max_input_vars] = 5000
php_admin_flag[log_errors] = on

; OPcache Optimalisasi untuk Produksi
php_admin_value[opcache.enable] = 1
php_admin_value[opcache.enable_cli] = 1
php_admin_value[opcache.memory_consumption] = 128
php_admin_value[opcache.interned_strings_buffer] = 16
php_admin_value[opcache.max_accelerated_files] = 10000
php_admin_value[opcache.validate_timestamps] = 0
php_admin_value[opcache.save_comments] = 1
